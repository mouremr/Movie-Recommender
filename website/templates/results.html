<!DOCTYPE html>
<html lang="en">
<head>
  <title>Your Recommendations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0a0a0f;
      color: #e8e6e0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1, h2 {
      font-family: 'DM Sans', sans-serif;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #8e54eb;
      margin: 0 auto 1.5rem;
    }

    /* Card fade-in */
    .card {
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Override table styles from pandas */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead tr {
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    thead th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #6b6b6b;
      font-weight: 500;
    }

    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.15s ease;
      animation: fadeUp 0.4s ease both;
    }

    tbody tr:nth-child(1)  { animation-delay: 0.05s; }
    tbody tr:nth-child(2)  { animation-delay: 0.10s; }
    tbody tr:nth-child(3)  { animation-delay: 0.15s; }
    tbody tr:nth-child(4)  { animation-delay: 0.20s; }
    tbody tr:nth-child(5)  { animation-delay: 0.25s; }
    tbody tr:nth-child(6)  { animation-delay: 0.30s; }
    tbody tr:nth-child(7)  { animation-delay: 0.35s; }
    tbody tr:nth-child(8)  { animation-delay: 0.40s; }
    tbody tr:nth-child(9)  { animation-delay: 0.45s; }
    tbody tr:nth-child(10) { animation-delay: 0.50s; }

    tbody tr:hover {
      background: rgba(255,255,255,0.03);
    }

    tbody td {
      padding: 1rem 1rem;
      color: #e8e6e0;
      vertical-align: middle;
    }

    /* Rank number styling - targets first column */
    tbody td:first-child {
      color: #4a4a4a;
      font-size: 0.8rem;
      width: 2.5rem;
      font-variant-numeric: tabular-nums;
    }

    /* Movie title - targets second column */
    tbody td:nth-child(2) {
      font-weight: 400;
      color: #e8e6e0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6b6b6b;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
      margin-bottom: 2.5rem;
    }
    .back-btn:hover { color: #af6ec9; }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 500;
      background: rgba(255,255,255,0.05);
      color: #6b6b6b;
    }

    .rank-badge.top {
      background: rgba(174, 110, 201, 0.15);
      color: #af6ec9;
    }
  </style>
</head>
<body>

  <div class="min-h-screen flex flex-col items-center justify-center px-4 py-16 relative z-10">

    <div class="w-full max-w-lg">

      <!-- Back link -->
      <a href="/" class="back-btn card">← Try another</a>

      <!-- Header -->
      <div class="card" style="animation-delay:0.05s; margin-bottom:2rem;">

        <h1 style="font-size:2rem; line-height:1.2; margin-bottom:0.5rem;">Your Results</em></h1>
        <div class="divider" style="margin:1rem 0 0;"></div>
      </div>

      <!-- Results card -->
      <div class="card" style="animation-delay:0.1s; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:8px; overflow:hidden; backdrop-filter:blur(12px);">

        <!-- Inject the pandas table here — we override its styles above -->
        <div id="results-table">
          {{ table|safe }}
        </div>

      </div>

      <p style="text-align:center; font-size:0.75rem; color:#3a3a3a; margin-top:1.25rem; letter-spacing:0.05em;">
        Based on your Letterboxd history · Powered by TMDB
      </p>

    </div>
  </div>

  <script>
    // Add rank badges to the first column of each row
    document.querySelectorAll('tbody tr').forEach((row, i) => {
      const firstCell = row.querySelector('td:first-child');
      if (firstCell) {
        const rank = i + 1;
        const isTop = rank <= 3;
        firstCell.innerHTML = `<span class="rank-badge ${isTop ? 'top' : ''}">${rank}</span>`;
      }
    });
  </script>

</body>
</html>
